<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPotato" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="potatoLeafGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3f6212" />
      <stop offset="40%" stop-color="#4d7c0f" />
      <stop offset="80%" stop-color="#1e3a12" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgPotato)" rx="16" />

  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="450" y1="0" x2="450" y2="450" />
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="300" x2="600" y2="300" />
  </g>

  <!-- Potato Oval Ovate Leaf -->
  <g transform="translate(300, 240) rotate(10)">
    <!-- Main leaf body -->
    <path d="M0,180 C-140,120 -180,-60 0,-190 C180,-60 140,120 0,180 Z" fill="url(#potatoLeafGrad)" stroke="#a3e635" stroke-width="1.5" />
    <!-- Center vein -->
    <path d="M0,180 L0,-185" stroke="#d9f99d" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
    <!-- Lateral veins -->
    <path d="M0,110 Q50,70 110,60" stroke="#bef264" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M0,110 Q-50,70 -110,60" stroke="#bef264" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M0,30 Q60,-20 130,-20" stroke="#bef264" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M0,30 Q-60,-20 -130,-20" stroke="#bef264" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M0,-50 Q50,-90 100,-100" stroke="#bef264" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M0,-50 Q-50,-90 -100,-100" stroke="#bef264" stroke-width="2" fill="none" opacity="0.6" />

    <!-- Concentric Target Ring Lesion 1 (Alternaria solani hallmark) -->
    <g transform="translate(45, -30)">
      <!-- Yellow chlorotic halo -->
      <circle cx="0" cy="0" r="42" fill="rgba(250, 204, 21, 0.35)" />
      <!-- Outer dark ring -->
      <circle cx="0" cy="0" r="30" fill="#292524" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#44403c" stroke-width="2" />
      <!-- Concentric ring 2 -->
      <circle cx="0" cy="0" r="20" fill="#1c1917" />
      <circle cx="0" cy="0" r="18" fill="none" stroke="#57534e" stroke-width="2" />
      <!-- Concentric ring 3 / Center bullseye -->
      <circle cx="0" cy="0" r="10" fill="#0c0a09" />
      <circle cx="0" cy="0" r="4" fill="#78716c" />
    </g>

    <!-- Concentric Target Ring Lesion 2 -->
    <g transform="translate(-60, 50)">
      <circle cx="0" cy="0" r="32" fill="rgba(250, 204, 21, 0.3)" />
      <circle cx="0" cy="0" r="22" fill="#292524" />
      <circle cx="0" cy="0" r="14" fill="#1c1917" />
      <circle cx="0" cy="0" r="6" fill="#0c0a09" />
    </g>
  </g>

  <!-- Diagnostic Overlay -->
  <g transform="translate(360, 310)">
    <rect width="210" height="64" rx="10" fill="rgba(15, 23, 42, 0.88)" stroke="#eab308" stroke-width="1.5" />
    <circle cx="20" cy="32" r="6" fill="#eab308" />
    <text x="36" y="28" fill="#fef08a" font-family="Inter, sans-serif" font-size="11" font-weight="700">CONCENTRIC TARGET RINGS</text>
    <text x="36" y="46" fill="#ca8a04" font-family="Inter, sans-serif" font-size="10">Alternaria solani</text>
  </g>

  <g transform="translate(24, 24)">
    <rect width="150" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="75" y="20" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">DEMO SAMPLE #3</text>
  </g>
</svg>
