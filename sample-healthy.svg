<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHealthy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1f16" />
      <stop offset="100%" stop-color="#061811" />
    </linearGradient>
    <linearGradient id="healthyLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d9365" />
      <stop offset="50%" stop-color="#40916c" />
      <stop offset="100%" stop-color="#1b5e3f" />
    </linearGradient>
    <radialGradient id="healthyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(72, 180, 130, 0.25)" />
      <stop offset="100%" stop-color="rgba(72, 180, 130, 0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgHealthy)" rx="16" />
  <circle cx="300" cy="225" r="200" fill="url(#healthyGlow)" />

  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="450" y1="0" x2="450" y2="450" />
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="300" x2="600" y2="300" />
  </g>

  <!-- Healthy Tomato Compound Leaf with vigorous green foliage -->
  <g transform="translate(300, 240) rotate(-10)">
    <!-- Main stem -->
    <path d="M-10,180 Q0,40 10,-150" stroke="#52b788" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- Terminal Leaflet -->
    <path d="M10,-150 C40,-190 20,-240 10,-260 C0,-240 -20,-190 10,-150 Z" fill="url(#healthyLeafGrad)" stroke="#74c69d" stroke-width="1.5" />
    <path d="M10,-150 L10,-245" stroke="#a7f3d0" stroke-width="2" fill="none" opacity="0.7" />

    <!-- Right upper leaflet -->
    <path d="M15,-80 C80,-110 130,-110 140,-80 C110,-40 60,-50 15,-80 Z" fill="url(#healthyLeafGrad)" stroke="#74c69d" stroke-width="1.5" />
    <path d="M15,-80 Q70,-75 125,-85" stroke="#a7f3d0" stroke-width="2" fill="none" opacity="0.6" />

    <!-- Left upper leaflet -->
    <path d="M5,-90 C-60,-120 -110,-120 -120,-90 C-90,-50 -40,-60 5,-90 Z" fill="url(#healthyLeafGrad)" stroke="#74c69d" stroke-width="1.5" />
    <path d="M5,-90 Q-55,-85 -105,-95" stroke="#a7f3d0" stroke-width="2" fill="none" opacity="0.6" />

    <!-- Right main leaflet (Healthy, intact, rich green) -->
    <path d="M5,10 C90,-20 160,0 170,40 C140,90 70,60 5,10 Z" fill="url(#healthyLeafGrad)" stroke="#74c69d" stroke-width="1.5" />
    <path d="M5,10 Q80,25 150,35" stroke="#a7f3d0" stroke-width="2.5" fill="none" opacity="0.7" />

    <!-- Left main leaflet (Healthy, intact, rich green) -->
    <path d="M-5,20 C-90,-10 -160,10 -170,50 C-140,100 -70,70 -5,20 Z" fill="url(#healthyLeafGrad)" stroke="#74c69d" stroke-width="1.5" />
    <path d="M-5,20 Q-80,35 -150,45" stroke="#a7f3d0" stroke-width="2.5" fill="none" opacity="0.7" />
  </g>

  <!-- Diagnostic Overlay: Healthy Foliage -->
  <g transform="translate(340, 290)">
    <rect width="230" height="64" rx="10" fill="rgba(6, 78, 59, 0.9)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="20" cy="32" r="6" fill="#10b981" />
    <text x="36" y="28" fill="#ecfdf5" font-family="Inter, sans-serif" font-size="11" font-weight="700">HEALTHY PLANT TISSUE</text>
    <text x="36" y="46" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="10">No foliar pathogens detected</text>
  </g>

  <g transform="translate(24, 24)">
    <rect width="150" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="75" y="20" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">DEMO SAMPLE #3</text>
  </g>
</svg>
