<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCorn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c19" />
      <stop offset="100%" stop-color="#091410" />
    </linearGradient>
    <linearGradient id="cornLeafGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2d6a4f" />
      <stop offset="50%" stop-color="#52b788" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgCorn)" rx="16" />

  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="450" y1="0" x2="450" y2="450" />
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="300" x2="600" y2="300" />
  </g>

  <!-- Corn Blade Leaf Shape -->
  <g transform="translate(100, 380) rotate(-35)">
    <path d="M0,0 C120,-120 280,-200 480,-240 C360,-160 220,-80 0,0 Z" fill="url(#cornLeafGrad)" stroke="#74c69d" stroke-width="2" />
    <!-- Midrib vein -->
    <path d="M0,0 C150,-100 300,-160 480,-240" stroke="#a7f3d0" stroke-width="4" fill="none" opacity="0.7" />

    <!-- Rust pustules (reddish/cinnamon brown elongated spots) -->
    <!-- Cluster 1 -->
    <ellipse cx="140" cy="-60" rx="8" ry="4" fill="#c2410c" transform="rotate(-15 140 -60)" />
    <ellipse cx="155" cy="-68" rx="10" ry="5" fill="#ea580c" transform="rotate(-10 155 -68)" />
    <ellipse cx="170" cy="-62" rx="7" ry="4" fill="#9a3412" transform="rotate(-20 170 -62)" />
    <ellipse cx="160" cy="-52" rx="9" ry="4" fill="#c2410c" transform="rotate(-12 160 -52)" />

    <!-- Cluster 2 -->
    <ellipse cx="240" cy="-110" rx="12" ry="5" fill="#ea580c" transform="rotate(-25 240 -110)" />
    <ellipse cx="260" cy="-118" rx="11" ry="5" fill="#c2410c" transform="rotate(-20 260 -118)" />
    <ellipse cx="250" cy="-100" rx="9" ry="4" fill="#9a3412" transform="rotate(-30 250 -100)" />
    <ellipse cx="275" cy="-125" rx="8" ry="4" fill="#ea580c" transform="rotate(-15 275 -125)" />

    <!-- Cluster 3 -->
    <ellipse cx="340" cy="-155" rx="11" ry="5" fill="#ea580c" transform="rotate(-20 340 -155)" />
    <ellipse cx="360" cy="-165" rx="14" ry="6" fill="#c2410c" transform="rotate(-25 360 -165)" />
    <ellipse cx="380" cy="-172" rx="9" ry="4" fill="#9a3412" transform="rotate(-15 380 -172)" />
  </g>

  <!-- Diagnostic Overlay -->
  <g transform="translate(350, 100)">
    <rect width="210" height="64" rx="10" fill="rgba(15, 23, 42, 0.88)" stroke="#f97316" stroke-width="1.5" />
    <circle cx="20" cy="32" r="6" fill="#f97316" />
    <text x="36" y="28" fill="#ffedd5" font-family="Inter, sans-serif" font-size="11" font-weight="700">COMMON RUST PUSTULES</text>
    <text x="36" y="46" fill="#fdba74" font-family="Inter, sans-serif" font-size="10">Puccinia sorghi</text>
  </g>

  <g transform="translate(24, 24)">
    <rect width="150" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="75" y="20" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">DEMO SAMPLE #2</text>
  </g>
</svg>
